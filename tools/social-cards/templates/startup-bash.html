<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "OswaldLocal";
        src: url("oswald.woff") format("woff");
        font-weight: 700;
        font-display: block;
      }
      /* One frame of the schedule grid's own animation.
         The Startup Bash row is the only one on the grid with bolts rising
         through it continuously — see BoltDrift in
         components/site/calendar/event-particles.tsx, and the note above it
         about why that row and the AI afternoon are the two exceptions to a
         still grid. This card is that row's field, from further back: same
         shape, same magenta, same ±19deg of spin, at the sizes a 1350px
         canvas holds instead of a 60px one.
         Nobody is on it, like College Night, so the bolts take the half a
         portrait holds everywhere else. */
      :root {
        --magenta: #ff32a0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1080px;
        height: 1350px;
        background: #000;
        color: #fff;
        font-family: "Geist", -apple-system, system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }

      <!--if:face-->
      /* Legacy Park's own SA lockup.
         The room's illustration, which lib/schedule.ts already hands this
         activation as its hero, cropped to the one thing in it that is ours:
         the bracket-and-bolt mark standing over the park in halftone, at
         x 250-560, y 60-380 of the source.
         It is a second SA mark on a card that already wears the house lockup
         top left, which is usually the argument against — but not at these
         two sizes and in these two registers. The lockup up there is 58px of
         flat white, the width lockup every card in the set opens with; this
         is 440px of magenta dot-matrix bleeding off two edges, the city's
         own sign for the place. One reads as the mark of the week, the other
         as the picture of where the party is, and nothing about the second
         asks to be read as a logo.
         Cropped in the box rather than in the file so the asset stays the one
         the site fetches: an oversized image in an overflow-hidden band,
         placed by its own offsets. */
      .park {
        position: absolute;
        z-index: 0;
        left: 500px;
        right: -20px;
        bottom: 40px;
        height: 540px;
        overflow: hidden;
        opacity: 1;
        filter: brightness(1.35) contrast(1.04);
        /* Only the edges that meet the card's black, and only just — a fade
           deep enough to be safe took the top of the bracket with it. The
           bottom and right are left alone because the crop bleeds past both. */
        -webkit-mask-image: linear-gradient(
            to top,
            #000 76%,
            rgba(0, 0, 0, 0) 100%
          ),
          linear-gradient(to left, #000 74%, rgba(0, 0, 0, 0) 100%);
        -webkit-mask-composite: source-in;
        mask-image: linear-gradient(to top, #000 76%, rgba(0, 0, 0, 0) 100%),
          linear-gradient(to left, #000 74%, rgba(0, 0, 0, 0) 100%);
        mask-composite: intersect;
      }
      /* 1113 wide against the source's 784 draws the mark 440px across and
         the halftone dots with it, which is what keeps this reading as the
         illustration rather than as a logo file. The two offsets put the
         mark's own top left corner at 80,40 inside the band. */
      .park img {
        position: absolute;
        left: -275px;
        top: -45px;
        width: 1113px;
        height: auto;
      }
      <!--/if:face-->

      /* The field, on the right.
         Positions are generated once and pasted in — fixed like the row's
         eight, and for the same reason those are: a card has to reproduce
         byte for byte. None of them starts left of x=430: the left of this
         card is the copy column and the big bolt's corner, and a field that
         crosses into it stops being weather on one side of the card and
         becomes speckle over the whole of it. Four boxes are held clear
         inside that right-hand band as well — the headline, the deck, the
         hook and the lockup inside the illustration — because a bolt landing
         on a word or on the middle of a mark reads as a mistake rather than
         as one of seventy.
         A quarter of them are aimed at the bottom band on purpose, and the
         generator then walks a 165px grid over the whole band and drops one
         into any cell the random pass left empty. Weighted by height alone
         the field thinned out below y=1200 and left corners of black in the
         lower right, which read as the field having stopped rather than as it
         running off the card. Randomness gives the arrangement; the grid pass
         is what guarantees there is no hole big enough to look like one. Depth is carried by three things at once, size,
         opacity and a sub-pixel blur on the far ones. Size alone read as
         bolts of different sizes rather than as one size at different
         distances.
         The row masks a single shape and colours it from `currentColor`,
         which is right there and impossible here: this page is loaded over
         file://, Chromium gives every file:// document its own opaque origin,
         and an SVG used as a CSS mask must be same-origin — so every
         mask-image request is blocked and the field renders empty. Tags
         instead, the way college-night.html stages the same file, which
         costs nothing: sastw-bolt.svg is already flat #ff32a0. */
      .field {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }
      .field img {
        position: absolute;
        display: block;
      }

      /* Black back under the copy, so no line ever sits on a bolt.
         Two gradients rather than one: the column holds the left third for the
         title and the hook, and the floor holds the bottom band for the when,
         the where and the sponsor. The field is densest low and right, which
         is exactly where both of those need to be clear. */
      /* The bolt the field is made of, once, at size.
         The mini bolts are one frame of the schedule row's animation and they
         read as weather — dozens of small marks, none of them the subject. A
         card can carry that and still want a subject, so this is the same
         shape at poster scale, in the corner the card's own details sit in.
         Placed off the shape, not off the box. The bolt is inset in its own
         square — x 0.127-0.705, y 0.053-0.778 of it, measured by rendering
         sastw-bolt.svg on its own — so every guess at these numbers before
         this one either cut an arm mid-stroke or left the shape floating in
         the middle of the card. At 724 the drawn bolt is 419 wide and 525
         tall and these two offsets put it at x 0-419, y 820-1345: the lower
         left, whole, touching the bottom edge without crossing it.
         That is the corner the facts and the sponsor sit in, and they sit on
         top of it on purpose — this is a ground for that block, not a
         neighbour to it.
         Below the hook, because the bolt may sit behind a picture and never
         behind a line of type. Quiet on purpose — 0.4 against TPR's 0.62 —
         because unlike that card this one already has magenta in it. At full
         charge the 78 small bolts stopped reading as a field and started
         reading as debris around a big shape. */
      .bolt {
        position: absolute;
        /* Above the scrim, where the small bolts are below it. That one
           difference is what lets the same gradient hold the left of the card
           quiet and still leave this shape at full strength — the alternative
           was removing the gradient, which brought the whole field back over
           the copy column. Painted after it in the markup as well, since both
           sit at z-index 1. */
        z-index: 1;
        left: -92px;
        top: 782px;
        width: 724px;
        height: auto;
        opacity: 0.4;
        filter: blur(5px);
      }

      /* The scrim that shapes the field.
         It is doing more than protecting copy. The field is generated across
         the whole card, and this is what makes it a right-hand field: the
         left-to-right gradient takes the bolts over the copy column down to
         nothing, so what reads is the two-thirds it leaves alone. Take it
         away and every bolt appears, and the card stops having a quiet side.
         The floor does the same for the bottom edge, under the facts and the
         sponsor. */
      .scrim {
        position: absolute;
        z-index: 1;
        inset: 0;
        background:
          linear-gradient(
            to right,
            #000 0%,
            rgba(0, 0, 0, 0.9) 22%,
            rgba(0, 0, 0, 0.48) 44%,
            rgba(0, 0, 0, 0) 64%
          ),
          linear-gradient(
            to top,
            #000 0%,
            rgba(0, 0, 0, 0.8) 11%,
            rgba(0, 0, 0, 0) 26%
          );
      }

      /* The bottom-left corner, under the frame's own text and over both
         bolts — tpr.html's fix, at half its strength. There the scrim clears
         the corner so the copy sits on black; here the block of facts and the
         sponsor is meant to sit on the bolt, so this only takes the top off
         the brightest part of it. Enough that the magenta pips beside the
         facts stay pips rather than dissolving into the shape behind them,
         and no more. z-index:-1 puts it inside .frame's stacking context,
         above the bolt without being above the type. */
      .frame::before {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: px;
        height: 560px;
        z-index: -1;
        background: radial-gradient(
          125% 95% at 0% 100%,
          rgba(0, 0, 0, 0.62) 0%,
          rgba(0, 0, 0, 0.4) 45%,
          rgba(0, 0, 0, 0) 78%
        );
      }

      .frame {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 74px 72px 84px;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .top img {
        height: 58px;
        width: auto;
      }
      .dates {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 19px;
        letter-spacing: 0.22em;
        color: #8b8b8b;
        text-transform: uppercase;
      }

      /* The circuit and the room, as the page's eyebrow gives them. */
      .eyebrow {
        margin-top: 72px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 21px;
        letter-spacing: 0.24em;
        color: var(--magenta);
        text-transform: uppercase;
      }

      h1 {
        margin-top: 20px;
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: {{headlineSize}}px;
        line-height: 0.86;
        letter-spacing: 0.005em;
        text-transform: uppercase;
      }

      /* The blurb's first sentence, at the size of a headline's second line.
         It is four words and it is the whole pitch — a card that sets it as
         body copy under the title buries the one line somebody reads. */
      .deck {
        margin-top: 30px;
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 52px;
        line-height: 1;
        letter-spacing: 0.005em;
        text-transform: uppercase;
        color: var(--magenta);
      }

      /* The rest of the blurb, in the house's quoted-line treatment. */
      .quote {
        margin-top: 34px;
        max-width: 520px;
        border-left: 3px solid var(--magenta);
        padding-left: 26px;
        font-size: 26px;
        line-height: 1.42;
        color: rgba(255, 255, 255, 0.88);
        text-wrap: balance;
      }

      .spacer {
        flex: 1;
      }

      .facts {
        display: flex;
        flex-direction: column;
        gap: 11px;
      }
      .fact {
        display: flex;
        align-items: center;
        gap: 13px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 21px;
        letter-spacing: 0.06em;
        color: #ededed;
      }
      .fact .pip {
        width: 9px;
        height: 9px;
        background: var(--magenta);
        flex: none;
      }

      .powered {
        margin-top: 40px;
      }
      .powered .label {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 16px;
        letter-spacing: 0.26em;
        color: #6f6f6f;
        text-transform: uppercase;
      }
      .logos {
        margin-top: 18px;
        display: flex;
        align-items: center;
        gap: 34px;
      }
      .logos img {
        width: auto;
      }
    </style>
