<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "OswaldLocal";
        src: url("oswald.woff") format("woff");
        font-weight: 700;
        font-display: block;
      }
      /* One band of the DEVSA card, at slide size.

         The full card is a poster: twenty-three marks, the whole claim, one
         image. It stops being a directory in a feed — each mark draws about
         66px in a 1350px image, which at Instagram's ~400px render is 20px,
         and the small badges go to mush while the wordmarks survive.

         So the carousel splits it by band and gives each one the whole frame.
         Six marks across two columns draw about three times larger than they
         do on the poster, which is the difference between a logo a reader
         recognises and a shape they scroll past. Slide one stays the poster —
         it is the one that has to work as a single share.

         Each slide also stands alone, which is the second reason: a group
         reposting "Invited to the week" is posting a card about itself, not a
         crop of somebody else's. */
      :root {
        --magenta: #ff32a0;
        --lav: #c0b4fc;
        --green: #00ff66;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1080px;
        height: 1350px;
        background: #000;
        color: #fff;
        font-family:
          "Geist",
          -apple-system,
          system-ui,
          sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* The homepage's bolt, whole and inside the margin.

         Not the flat silhouette the other cards ground themselves with — this
         is `bolt-current-og.png`, the still of the live WebGL hero that
         lib/og.tsx puts on the site's own share cards. On this card it is the
         house's half of the co-brand: the marks are what DEVSA brought, and
         this is what they are powering.

         Whole, because at full charge it is a subject rather than a texture,
         and the site draws it whole wherever it is one — the hero, every OG
         card, the community meetup card. A bleed reads as intentional only
         when the mark has been dimmed back into the ground, which is exactly
         what `sastw-bolt.svg` at 0.17 is for. Cropped at full charge it reads
         as a mark that did not fit. */
      .bolt {
        position: absolute;
        z-index: 1;
        right: 62px;
        /* Sized by what it has to clear, not by what looks big. Its column is
           bounded above by the co-brand row — the lockup runs to x863, so the
           bolt cannot rise past it without its upper arm crossing the type —
           and below by the first band's rule at y470. 300 inside a 128 top
           puts its tip at y428, which is 42px of air rather than the overlap
           372 was drawing. */
        top: 128px;
        width: 300px;
        opacity: 0.95;
      }

      .frame {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
      }

      /* Equal, and equal by what is drawn rather than by file height. DEVSA's
         mark is a 1.3:1 badge and the lockup a 4:1 wordmark, so a shared
         height draws one at a third of the other's width — these are solved
         to the same ~250px across. */
      .brands {
        display: flex;
        align-items: center;
        gap: 30px;
      }
      .brands img.devsa {
        height: 92px;
      }
      .brands .rule {
        width: 1px;
        height: 64px;
        background: rgba(255, 255, 255, 0.22);
      }
      .brands img.sastw {
        height: 64px;
      }

      .eyebrow {
        margin-top: 52px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 19px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--magenta);
      }
      h1 {
        margin-top: 14px;
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 74px;
        line-height: 0.96;
        letter-spacing: 0.005em;
        text-transform: uppercase;
      }
      h1 .hit {
        color: var(--magenta);
      }

      /* Three bands, not two — see the note on the labels. */
      .band {
        margin-top: 40px;
        flex: 1;
      }
      .band .grid {
        height: 100%;
        align-content: center;
      }
      .band .label {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      }

      /* One box per mark, and each mark takes what it can of it.

         That is what "equal size" has to mean across ratios running 1:1 to
         10:1. Matched on height, Google Developer Groups draws five times
         DEF CON's width; matched on width, DEF CON draws five times GDG's
         height. A shared box with a cap on both axes is the only rule under
         which a badge and a wordmark read as peers. */
      .grid {
        margin-top: 26px;
        display: grid;
        grid-template-columns: repeat({{cols}}, 1fr);
        gap: 56px 40px;
      }
      .cell {
        height: {{cellH}}px;
        display: flex;
        align-items: center;
        justify-content: center;
        list-style: none;
      }
      .cell img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
      }

      .typeset {
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        /* Bigger than the poster's 27px, and bigger than a straight scale
           of it. The image marks fill their cell's width; a typeset mark is
           whatever the font-size makes it, so on a slide where cells are
           460px wide it has to be set up to meet them rather than left at a
           size solved against a 210px cell. */
        font-size: 54px;
        line-height: 1;
        letter-spacing: 0.005em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .typeset .lav {
        background: var(--lav);
        color: #000;
        padding: 0 7px;
      }
      .typeset .green {
        color: var(--green);
      }
      /* The prompt runs a step smaller and a step back — it is a label device
         rather than part of the name, and at full weight it read as the first
         word of the mark. */
      .typeset .prompt {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 0.72em;
        color: var(--green);
        opacity: 0.75;
      }
      .typeset .mag {
        color: var(--magenta);
      }

      /* A floor, not just `auto`: a grid row is as tall as its cells, and a
         mark scaled past its box overhangs into the gap — without this the
         date sat under Alamo City Locksport's overhang. */
      .foot {
        margin-top: auto;
        padding-top: 30px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 20px;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.82);
      }
      .foot .pip {
        width: 9px;
        height: 9px;
        background: var(--magenta);
        flex: none;
      }
      .foot .sep {
        color: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <img class="bolt" src="bolt-current.png" alt="" />

    <div class="frame">
      <div class="brands">
        <img class="devsa" src="devsa.png" alt="" />
        <span class="rule"></span>
        <img class="sastw" src="sastw.png" alt="" />
      </div>

      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{headline}}</h1>

      <div class="band">
        <ul class="grid">
          {{marksA}}
        </ul>
      </div>

      <div class="foot">
        <span class="pip"></span>
        <span>{{fact1}}</span>
        <span class="sep">·</span>
        <span>{{fact2}}</span>
      </div>
    </div>
  </body>
</html>
