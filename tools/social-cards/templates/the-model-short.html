<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "OswaldLocal";
        src: url("oswald.woff") format("woff");
        font-weight: 700;
        font-display: block;
      }
      /* The Model's palette, from lib/the-model. */
      :root {
        --lav: #c0b4fc;
        --cyan: #00b4fc;
        --ink: #09090b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* 9:16, for The Model's running order.
       *
       * The third Short template, and the differences between the three are
       * their events'. PySanAntonio reveals seven talks over its own footage;
       * a community group shows a two-talk bill with the faces giving them.
       * The Model has eight talks and nine speakers, which is too many faces
       * for a bill and too long a list to sit under a figure — so this one is
       * the lineup itself, arriving a line at a time, with nothing behind it.
       *
       * Opaque, and encoded straight from its own states: there is no footage
       * under this. See `card.video || stills` in render.mjs.
       */
      body {
        width: 1080px;
        height: 1920px;
        background: #000;
        color: #fff;
        font-family: "Geist", -apple-system, system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }

      .frame {
        position: relative;
        height: 100%;
        padding: 64px 72px 0;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      /* 80, as on the other two Shorts: watched at arm's length, often at
         half size, where this set's still-card 58 stops being legible. */
      .top img {
        height: 80px;
        width: auto;
      }
      .dates {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 19px;
        letter-spacing: 0.22em;
        color: #8b8b8b;
        text-transform: uppercase;
      }

      /* The event page's own type for its own name — Geist Mono, medium,
         tight, with MODEL knocked out of a lavender panel. The poster carries
         the same treatment and the same reasoning: the artwork is set in a
         plain monospace, and a display face beside it is a second voice. */
      h1 {
        margin-top: 46px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        font-size: 104px;
        line-height: 1.05;
        letter-spacing: -0.025em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
      }
      h1 .panel {
        background: var(--lav);
        color: var(--ink);
        display: inline-block;
        line-height: 1;
        padding: 4px 16px 10px;
      }

      /* The hook, as the page sets it: regular weight, white at 80%, cyan
         rule. Not the headline's lavender — that colour is the panel's. */
      .quote {
        margin-top: 30px;
        max-width: 860px;
        border-left: 3px solid var(--cyan);
        padding-left: 24px;
        font-size: 30px;
        line-height: 1.34;
        color: rgba(255, 255, 255, 0.8);
      }

      .kicker {
        margin-top: 40px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 22px;
        letter-spacing: 0.24em;
        color: var(--lav);
        text-transform: uppercase;
      }

      /* Eight rows in the column that is left. The talk leads and the people
         follow, as on the lineup slide and for the same reason: this card's
         job is the story of the afternoon, and the eight subjects tell it
         better than nine names would. */
      .rows {
        margin-top: 30px;
        /* Takes the column and centres in it, rather than stacking under the
           kicker and leaving 800px of black above the call to action. The
           block holds its full height from the first frame either way, so
           centring does not move a row once it has arrived. */
        flex: 1;
        min-height: 0;
        margin-bottom: 200px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 34px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 24px;
        /* `visibility`, not `display`: the block holds its full height from
           the first frame, so a row arriving never moves the rows already
           read. The same note the PySanAntonio Short carries. */
        visibility: hidden;
      }
      .row .at {
        flex: none;
        width: 100px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 23px;
        letter-spacing: 0.04em;
        color: #8b8b8b;
      }
      .row .who {
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 46px;
        line-height: 1.04;
        letter-spacing: 0.005em;
        text-transform: uppercase;
      }
      .row .what {
        margin-top: 7px;
        font-size: 26px;
        font-weight: 500;
        color: var(--lav);
      }

      .cta {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 68px;
        opacity: 0;
      }
      .cta .line {
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 46px;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }
      .cta .url {
        margin-top: 14px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 24px;
        letter-spacing: 0.06em;
        color: var(--lav);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="top">
        <img src="sastw.png" alt="" />
        <div class="dates">{{week}}</div>
      </div>

      <h1>{{headline}}</h1>
      <p class="quote">{{subtitle}}</p>
      <div class="kicker">{{kicker}}</div>
      <div class="rows">{{rows}}</div>
    </div>

    <div class="cta">
      <div class="line">{{ctaLine}}</div>
      <div class="url">{{ctaUrl}}</div>
    </div>

    <script>
      /**
       * Step 0 is the header alone — name, hook, and the label saying what is
       * about to fill the column. Steps 1..8 add one talk each. The step after
       * the last row brings up the ask.
       */
      window.reveal = function (step) {
        const rows = document.querySelectorAll(".row");
        rows.forEach((el, i) => {
          el.style.visibility = i < step ? "visible" : "hidden";
        });
        document.querySelector(".cta").style.opacity =
          step > rows.length ? "1" : "0";
      };
      window.reveal(0);
    </script>
  </body>
</html>
