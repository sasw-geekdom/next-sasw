<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "OswaldLocal";
        src: url("oswald.woff") format("woff");
        font-weight: 700;
        font-display: block;
      }
      /* Access Granted's values, from lib/access-granted.ts. The grid line and
         its mask are lifted verbatim so the card and the band draw the same
         field. */
      :root {
        --green: #00ff66;
        --grid: rgba(255, 255, 255, 0.055);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1080px;
        height: 1350px;
        background: #000;
        color: #fff;
        font-family: "Geist", -apple-system, system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* The schematic field — this is the device that says Access Granted
         before a word is read, the way the wordmark does for PySA. */
      .grid {
        position: absolute;
        inset: -10%;
        /* Per card. 0.055 is what a field sitting behind a figure wants —
           any more and the schematiccompetes with the cutout. A card using
           the field to hold empty space needs it to actually read: at 0.055
           under this template's scrim a lit line peaks at 13/255, which is
           measurable and invisible. */
        background-image:
          linear-gradient(rgba(255, 255, 255, {{gridInk}}) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, {{gridInk}}) 1px,
            transparent 1px
          );
        background-size: 34px 34px;
        /* Per card. The default keeps the field where it has always been —
           gathered behind the figure on the right, because on a speaker card
           the left half is the name and the facts and a schematic running
           under them competes with type it is meant to sit behind.
           A card with no figure on the left has nothing to compete with, and
           the black there reads as a hole rather than as space. Widening the
           mask is the right lever rather than the bloom: the bloom is green
           and this brand's note is that the green stays sparing (see below),
           where the grid is a line field at 4% white. */
        mask-image: radial-gradient(
          ellipse {{gridMask}},
          black 0%,
          black 20%,
          transparent 74%
        );
        -webkit-mask-image: radial-gradient(
          ellipse {{gridMask}},
          black 0%,
          black 20%,
          transparent 74%
        );
      }
      /* Tight and weak on purpose. A wider, stronger bloom spread green to
         rgb(12,49,27) at mid-card and read as a wash — and this brand's own
         note is that the green stays sparing. */
      .bloom {
        position: absolute;
        right: -170px;
        top: 360px;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(0, 255, 102, 0.2) 0%,
          transparent 64%
        );
        filter: blur(100px);
      }

      .portrait {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .portrait img {
        position: absolute;
        left: {{portraitLeft}}px;
        /* Per card, defaulting to the 0 every card here has always used.
           A cutout whose file carries empty alpha under the figure floats
           when it is bottom-anchored — the frame's edge is not the ink's.
           Corey Hartman's has 141px of it, so his card pushes the box down
           by that much, scaled. `portraitBottom` is 0 unless a card sets it,
           so nothing else moves. */
        bottom: {{portraitBottom}}px;
        height: {{portraitHeight}}px;
        width: auto;
      }
      /* The scrim that holds the figure off the copy.
         Its left stop is per card, because it is the reason the left of this
         template is black and not because the field stops there: the schematic
         reaches most of the card, and this paints over it. That is right when
         a figure stands in the middle and a name has to read across it, and
         wrong on a card whose picture is small and parked on the right — there
         it blacks out the one thing filling the space. */
      <!--if:greyscale-->
      /* A mono cut of the same card. The token already existed for the
         community template; this stage had never asked for one because its
         figures are the only colour on a black-and-green card. Mike Bell's
         is the exception \u2014 a full-length figure in a hood with a sword, which
         is a photograph rather than a headshot, and the desaturated cut reads
         as the poster the colour one cannot be. */
      .portrait img {
        filter: grayscale(1);
      }
      <!--/if:greyscale-->

      .portrait::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to right, {{scrimLeft}}),
          linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0) 14%);
      }

      .frame {
        position: relative;
        z-index: 3;
        height: 100%;
        padding: 74px 72px 52px;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .top img {
        height: 58px;
        width: auto;
      }
      .dates {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 19px;
        letter-spacing: 0.22em;
        color: #8b8b8b;
        text-transform: uppercase;
      }

      /* Typeset, not a logo file — this event's mark is its name, with
         everything up to the first space in the green. The same split the band
         makes off `ACCESS_GRANTED.name`. */
      .wordmark {
        margin-top: 50px;
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        /* Per card, defaulting to the 92 every speaker card here uses. On
           those the name is a standfirst over the talk's title, which is the
           bigger line; on the event card there is no talk, so the event's own
           name is the title and takes the size. */
        font-size: {{wordmarkSize}}px;
        line-height: 0.9;
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }
      .wordmark .a {
        color: var(--green);
      }

      h1 {
        margin-top: 30px;
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: {{headlineSize}}px;
        line-height: 1;
        text-transform: uppercase;
      }

      <!--if:subtitle-->
      /* A rule, not a filled panel. The band's note is explicit that a solid
         block of #00ff66 shouts at this size. */
      .subtitle {
        margin-top: 22px;
        max-width: 520px;
        border-left: 2px solid var(--green);
        padding-left: 20px;
        font-size: 27px;
        line-height: 1.34;
        color: rgba(255, 255, 255, 0.8);
      }
      <!--/if:subtitle-->

      .spacer {
        flex: 1;
      }
      .name {
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 62px;
        line-height: 0.98;
        text-transform: uppercase;
      }
      .role {
        margin-top: 16px;
        margin-bottom: 4px;
        font-size: 27px;
        font-weight: 600;
        color: var(--green);
      }
      <!--if:org-->
      .org {
        margin-top: 10px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 19px;
        letter-spacing: 0.2em;
        color: #8b8b8b;
        text-transform: uppercase;
      }
      <!--/if:org-->

      .facts {
        margin-top: 26px;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }
      .fact {
        display: flex;
        align-items: center;
        gap: 13px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 21px;
        letter-spacing: 0.06em;
        color: #ededed;
      }
      .fact .pip {
        width: 9px;
        height: 9px;
        background: var(--green);
        flex: none;
      }

      .powered {
        margin-top: 40px;
      }
      /* This event labels with a terminal prompt, where SASTW and The Model
         use `//`. */
      .powered .label {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 16px;
        letter-spacing: 0.26em;
        color: #6f6f6f;
        text-transform: uppercase;
      }
      .powered .label span {
        color: var(--green);
      }
      /* Six organisers in two rows of three by default, not one row of six.
         One row can only hold them at 34px before it reaches the figure — the
         other events get a single row because they have three partners, not
         six.
         Per card, because that constraint is the *figure's*, not the strip's.
         A card whose art sits high leaves the whole 936px measure free down
         here, and six marks across it draw 682 — see the village card. */
      .logos {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat({{logoCols}}, auto);
        justify-items: start;
        align-items: center;
        gap: 6px 26px;
        width: fit-content;
      }
      .logos img {
        width: auto;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="bloom"></div>
    <!--if:face-->
    <div class="portrait"><img src="{{face}}" alt="" /></div>
    <!--/if:face-->

    <div class="frame">
      <div class="top">
        <img src="sastw.png" alt="" />
        <div class="dates">{{week}}</div>
      </div>

      <div class="wordmark"><span class="a">Access</span> Granted</div>

      <!-- Guarded, because a card whose title is the event's own name has
           nothing to put here — see `wordmarkSize`. Every speaker card sets a
           headline, so this resolves and changes nothing for them. -->
      <!--if:headline-->
      <h1>{{headline}}</h1>
      <!--/if:headline-->
      <!--if:subtitle-->
      <p class="subtitle">{{subtitle}}</p>
      <!--/if:subtitle-->

      <div class="spacer"></div>

      <!--if:first-->
      <div class="name">{{first}}<br />{{last}}</div>
      <div class="role">{{role}}</div>
      <!--if:org-->
      <div class="org">{{org}}</div>
      <!--/if:org-->
      <!--/if:first-->

      <div class="facts">
        <div class="fact"><span class="pip"></span>{{fact1}}</div>
        <div class="fact"><span class="pip"></span>{{fact2}}</div>
        <!-- Guarded, like community-group.html's. Two is the shape of every
             speaker card here — a day and a floor — and the third exists for
             the event card, where the hours are a fact of their own rather
             than a tail on the date. `fact3` is always in the data as "" when
             a card has two, so the guard resolves and leaves nothing. -->
        <!--if:fact3-->
        <div class="fact"><span class="pip"></span>{{fact3}}</div>
        <!--/if:fact3-->
      </div>

      <div class="powered">
        <div class="label"><span>&gt;_</span> Powered by</div>
        <div class="logos">{{logos}}</div>
      </div>
    </div>
  </body>
</html>
