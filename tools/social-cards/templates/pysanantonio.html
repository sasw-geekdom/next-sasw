<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "OswaldLocal";
        src: url("oswald.woff") format("woff");
        font-weight: 700;
        font-display: block;
      }
      /* PySanAntonio's own palette, from lib/pysa.ts. Deliberately not SASTW
         magenta — this is the one activation with a brand of its own. */
      :root {
        --blue: #4a90d9;
        --gold: #edca00;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1080px;
        height: 1350px;
        background: #000;
        color: #fff;
        font-family: "Geist", -apple-system, system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* The band's signature: a blue bloom behind the figure. It is what makes
         the surface read as PySA before a word of it is read. */
      .bloom {
        position: absolute;
        right: -140px;
        top: 130px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--blue) 0%, transparent 65%);
        opacity: 0.3;
        filter: blur(120px);
      }

      /* Full-bleed, so its scrim has no edge to show. Boxed to the right half
         the gradient starts at opaque black against a bloom that carries on
         past it, and draws a vertical seam down the card. */
      .portrait {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .portrait img {
        position: absolute;
        left: {{portraitLeft}}px;
        bottom: 0;
        height: {{portraitHeight}}px;
        width: auto;
      }
      .portrait::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to right, #000 0%, #000 20%, rgba(0, 0, 0, 0) 52%),
          linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0) 14%);
      }

      <!--if:transparent-->
      /* A motion card's overlay. The PNG is composited over the event's own
         footage, so the ground has to go — `omitBackground` only reaches
         transparent where the page is, and every template paints `body`
         black.

         The scrim stays, and does the job `.portrait::after` does on the
         still card: the copy sits on the left third, and without a gradient
         holding that side down the type would run over a moving figure. Same
         two gradients, same stops, now over video instead of a photograph. */
      body {
        background: transparent;
      }
      .scrim {
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(to right, #000 0%, #000 20%, rgba(0, 0, 0, 0) 52%),
          linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0) 14%);
      }
      /* No bloom on the motion card.

         This is the whole of what makes the composite work, and it took
         three passes to arrive at. The bloom is a blue radial across the
         card's right side; the clip's ground is flat black. Laid over the
         footage at its own size the tint stopped partway down and the card
         switched from graded to flat in a single line where the footage
         began — a rectangle, not a background.

         Two fixes were tried and both were wrong in the same way: they
         changed the figure to fix the ground. Crushing the clip's blacks
         matched the two sides at black — throwing the gradient away rather
         than continuing it, and darkening the luchador to do it. Growing the
         bloom to cover the whole frame continued the gradient, and hazed him
         blue, because a translucent wash over a subject is what it is.

         A bloom belongs *behind* a matted figure. Nothing here is matted —
         not the footage, not the mascot on the still card — so the card
         drops it and runs a flat ground the clip's own black already
         matches. See `if:artBlock` for the still card's half of this. */
      .bloom {
        display: none;
      }
      <!--/if:transparent-->

      <!--if:artBlock-->
      /* The still card's half of the motion card's problem.

         The mascot is a block, not a cutout: opaque out to a feathered edge,
         where every headshot in this set is matted. Drawn over the bloom it
         paints the gradient out inside its own rectangle and the card goes
         from graded to flat along the picture's edge — the same switch the
         footage made, on a photograph.

         Same answer, for the same reason: the bloom goes, and the ground is
         matched to the picture instead. #0d0d0d is the median of the block's
         own opaque ground (it runs 10–17 across the frame), so the largest
         disagreement anywhere is about four levels, under a feathered edge —
         which is no edge at all. The scrim still holds the copy side down to
         black, so the card reads as black with the figure sitting in it. */
      body {
        background: #0d0d0d;
      }
      .bloom {
        display: none;
      }
      <!--/if:artBlock-->

      .frame {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 74px 72px 64px;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      /* 58, matching access-granted, community-group and college-night. It
         was 46 — the smallest lockup in the set, with nothing on the card
         saying why, and beside the blackletter wordmark below it read as an
         afterthought rather than as the week this event belongs to.

         This moves all seven PySanAntonio cards, not just the event card:
         the lockup is a property of the template, and a speaker card and an
         event card posted in the same series with the house mark at two
         sizes is the drift these templates exist to prevent. */
      .top img {
        height: 58px;
        width: auto;
      }
      .dates {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 19px;
        letter-spacing: 0.22em;
        color: #8b8b8b;
        text-transform: uppercase;
      }

      /* The wordmark leads, at size. On PySA's own band the mark *is* the
         headline rather than a label above one. */
      .wordmark {
        margin-top: 48px;
        height: 136px;
        width: auto;
        display: block;
        /* A flex column stretches its children; without this the wordmark
           centres itself against a page whose every other line is flush
           left. */
        align-self: flex-start;
      }

      h1 {
        margin-top: 34px;
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: {{headlineSize}}px;
        line-height: 1;
        letter-spacing: 0.005em;
        text-transform: uppercase;
      }
      /* A filename is not a word. Uppercased by the transform above it stops
         reading as a file; given its own line box rather than sitting inline,
         because the mono has far less ascent than the display face and all of
         the difference lands above it — 44px of gap over the line and none
         under it. */
      h1 code {
        display: block;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 0.66em;
        font-weight: 500;
        line-height: 1;
        margin: 6px 0 10px;
        text-transform: none;
        letter-spacing: -0.01em;
        color: var(--gold);
      }

      <!--if:subtitle-->
      /* The half of the title after the colon. Geist, not the display face, so
         it reads as explanation under a hook rather than a further line of
         headline — and capped short of the portrait so it never wraps around
         a face. */
      .subtitle {
        margin-top: 22px;
        max-width: 560px;
        font-size: 27px;
        line-height: 1.34;
        color: rgba(255, 255, 255, 0.72);
        text-wrap: balance;
      }
      <!--/if:subtitle-->

      .spacer {
        flex: 1;
      }
      .name {
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 62px;
        line-height: 0.98;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }
      /* Blue on the role, not on the name. The blue-and-gold split is the
         wordmark's signature; repeating it on a person makes the name read as
         a second logo and the logo less singular. */
      .role {
        margin-top: 16px;
        font-size: 27px;
        font-weight: 600;
        color: var(--blue);
      }
      <!--ifnot:org-->
      /* Only where the speaker's record carries no company. The block after
         the flex spacer is bottom-anchored as a group, so a margin added here
         unconditionally makes the group taller and lifts the *name* by that
         much on every card that does have an org. */
      .role {
        margin-bottom: 4px;
      }
      <!--/ifnot:org-->
      <!--if:org-->
      .org {
        margin-top: 10px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 19px;
        letter-spacing: 0.2em;
        color: #8b8b8b;
        text-transform: uppercase;
      }
      <!--/if:org-->

      .facts {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }
      .fact {
        display: flex;
        align-items: center;
        gap: 13px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 21px;
        letter-spacing: 0.06em;
        color: #ededed;
      }
      .fact .pip {
        width: 9px;
        height: 9px;
        background: var(--blue);
        flex: none;
      }

      .powered {
        margin-top: 46px;
      }
      /* No slashes. `//` is the SASTW and Model device; PySA's own band labels
         this plainly. */
      .powered .label {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 16px;
        letter-spacing: 0.26em;
        color: #6f6f6f;
        text-transform: uppercase;
      }
      .logos {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 34px;
      }
      .logos img {
        width: auto;
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <!--if:transparent-->
    <div class="scrim"></div>
    <!--/if:transparent-->
    <div class="bloom"></div>
    <!--if:face-->
    <div class="portrait"><img src="{{face}}" alt="" /></div>
    <!--/if:face-->

    <div class="frame">
      <div class="top">
        <img src="sastw.png" alt="" />
        <div class="dates">{{week}}</div>
      </div>

      <img class="wordmark" src="pysa.svg" alt="" />

      <h1>{{headline}}</h1>
      <!--if:subtitle-->
      <p class="subtitle">{{subtitle}}</p>
      <!--/if:subtitle-->

      <div class="spacer"></div>

      <!--if:first-->
      <div class="name">{{first}}<br />{{last}}</div>
      <div class="role">{{role}}</div>
      <!--if:org-->
      <div class="org">{{org}}</div>
      <!--/if:org-->
      <!--/if:first-->

      <div class="facts">
        <div class="fact"><span class="pip"></span>{{fact1}}</div>
        <div class="fact"><span class="pip"></span>{{fact2}}</div>
      </div>

      <div class="powered">
        <div class="label">Powered by</div>
        <div class="logos">{{logos}}</div>
      </div>
    </div>
  </body>
</html>
