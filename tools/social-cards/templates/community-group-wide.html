<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "OswaldLocal";
        src: url("oswald.woff") format("woff");
        font-weight: 700;
        font-display: block;
      }
      /* The community-group card at 1200x630, for Meetup and anything else on
         the OG ratio.
         Not a crop of the portrait card — 0.8:1 to 1.9:1 is a different
         composition — and deliberately not the same content. Meetup prints the
         group name, the event title, the date, the time and the venue beside
         this image, so a card repeating them spends its whole width on things
         the reader is already looking at. What the platform does not say is
         that this meetup is part of Startup + Tech Week, and it never shows
         the speaker's face. So: the co-brand, the face, the hook, the name,
         and nothing else. */
      :root {
        --magenta: #ff32a0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #000;
        color: #fff;
        font-family: "Geist", -apple-system, system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* Ground, at the community cards' charge rather than TPR's — there is a
         colour portrait here and the bolt is not the subject. */
      .bolt {
        position: absolute;
        z-index: 1;
        left: -150px;
        top: 40px;
        width: 620px;
        height: auto;
        opacity: 0.17;
        filter: blur(7px);
      }

      .portrait {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .portrait img {
        position: absolute;
        left: {{portraitLeft}}px;
        bottom: 0;
        height: {{portraitHeight}}px;
        width: auto;
      }
      /* Steeper than the portrait card's. The figure starts at 63% of the
         width here against 41% there, so the fade has less room to travel and
         has to be solid further right to keep the copy on black. */
      .portrait::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to right, #000 0%, #000 52%, rgba(0, 0, 0, 0) 78%),
          linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0) 18%);
      }

      /* Meetup re-crops event images across its list, page and mobile
         placements, so nothing that has to survive sits near an edge. 72px is
         6% in from the sides, 56px is 9% top and bottom. */
      .frame {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 56px 72px;
        display: flex;
        flex-direction: column;
      }

      /* The co-brand, and the reason this card exists: a rule between the two
         marks rather than one above the other, because the fact is that they
         are running this together. */
      .brands {
        display: flex;
        align-items: center;
        gap: 26px;
      }
      .brands img.sastw {
        height: 48px;
        width: auto;
      }
      .brands .rule {
        width: 1px;
        height: 40px;
        background: rgba(255, 255, 255, 0.22);
      }
      .brands img.mark {
        height: {{markHeight}}px;
        width: auto;
      }

      /* Two of them, so the copy sits below the middle rather than on the
         floor. Pinned to the bottom it left ~300px of empty left column under
         the marks, and it put the name in the strip Meetup is most likely to
         crop. */
      .spacer {
        flex: 1;
      }
      .spacer-b {
        flex: 0.5;
      }

      h1 {
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: {{headlineSize}}px;
        line-height: 1;
        letter-spacing: 0.005em;
        text-transform: uppercase;
        max-width: 620px;
      }
      <!--if:subtitle-->
      /* The half of the title after the colon. Meetup prints the whole thing
         beside the image, but the image outlives that page — it is the
         preview wherever the link is pasted, and "Behind the Answer" on its
         own does not say what the talk is about. */
      .subtitle {
        margin-top: 16px;
        max-width: 600px;
        font-size: 26px;
        line-height: 1.3;
        color: rgba(255, 255, 255, 0.72);
      }
      <!--/if:subtitle-->

      .name {
        margin-top: 18px;
        font-size: 27px;
        font-weight: 600;
        color: var(--magenta);
      }
    </style>
  </head>
  <body>
    <img class="bolt" src="bolt.svg" alt="" />
    <div class="portrait"><img src="{{face}}" alt="" /></div>

    <div class="frame">
      <div class="brands">
        <img class="sastw" src="sastw.png" alt="" />
        <span class="rule"></span>
        <img class="mark" src="{{mark}}" alt="" />
      </div>

      <div class="spacer"></div>

      <h1>{{headline}}</h1>
      <!--if:subtitle-->
      <p class="subtitle">{{subtitle}}</p>
      <!--/if:subtitle-->
      <div class="name">{{first}} {{last}}</div>

      <div class="spacer-b"></div>
    </div>
  </body>
</html>
