<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "OswaldLocal";
        src: url("oswald.woff") format("woff");
        font-weight: 700;
        font-display: block;
      }

      /* Access Granted's second Short: the afternoon a face at a time.

         The first (access-granted-short.html) is the running order as a list,
         which says what is on. This one says who — each speaker gets a frame
         of their own, standing at the foot of it under their hour and their
         title, the way the feed cards put them. It borrows that Short's
         ground, wordmark and outro so the two read as one series.

         The talks come off the CMS in running order, with the community group
         whose hour each falls in (`lineupOf` in render.mjs). The scenes are
         built there; this file decides what a step shows. */
      :root {
        --green: #00ff66;
        --grid: rgba(255, 255, 255, 0.055);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1080px;
        height: 1920px;
        background: #000;
        color: #fff;
        font-family: "Geist", -apple-system, system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* The schematic and the glow, as on the first Short. */
      .grid {
        position: absolute;
        inset: -10%;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 55%, black 0%, black 26%, transparent 76%);
        -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 55%, black 0%, black 26%, transparent 76%);
      }
      .bloom {
        position: absolute;
        left: 50%;
        top: 900px;
        width: 1000px;
        height: 1000px;
        margin-left: -500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 255, 102, 0.18) 0%, transparent 64%);
        filter: blur(120px);
      }

      /* The chrome every talk scene shares: the week's lockup and the day,
         and the event's own name under them — small, because in these frames
         the speaker is the subject and the name is the frame. */
      .chrome {
        position: absolute;
        z-index: 4;
        left: 72px;
        right: 72px;
        top: 96px;
      }
      .chrome .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .chrome .top img {
        height: 56px;
        width: auto;
      }
      .dates {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 19px;
        letter-spacing: 0.22em;
        color: #8b8b8b;
        text-transform: uppercase;
      }
      .chrome .mark {
        margin-top: 44px;
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 56px;
        line-height: 1;
        text-transform: uppercase;
      }
      .a {
        color: var(--green);
      }

      /* One scene per step, stacked, only the current one visible. */
      .scene {
        position: absolute;
        inset: 0;
        z-index: 2;
        visibility: hidden;
      }

      /* ── The opener: the name at size and the line ─────────────────── */
      .open-scene {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 72px 120px;
      }
      .open-scene .big {
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 176px;
        line-height: 0.88;
        text-transform: uppercase;
      }
      .open-scene .hook {
        margin-top: 44px;
        max-width: 860px;
        border-left: 3px solid var(--green);
        padding-left: 28px;
        font-size: 40px;
        line-height: 1.3;
        color: rgba(255, 255, 255, 0.85);
      }
      .open-scene .when {
        margin-top: 56px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 26px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8b8b8b;
      }
      .open-scene .when span {
        color: var(--green);
      }

      /* ── A talk ─────────────────────────────────────────────────────── */
      /* The speaker at the foot of the frame, centred and full height — the
         feed cards' figure, given the whole width. Colour, as on those
         cards. */
      .talk .figure {
        position: absolute;
        z-index: 1;
        left: 50%;
        transform: translateX(-50%);
        width: auto;
        /* The headshots are cut at their own frame, and a centred figure shows
           both sides of it — Jacob's shirt ended in two straight verticals.
           The feed cards hide one edge off the card and the other under a
           scrim; here both fade into the black instead, which is also how a
           shoulder turning away from a light would read. */
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 16%, #000 84%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0%, #000 16%, #000 84%, transparent 100%);
      }
      /* The copy sits above the figure's crown. A shallow scrim under it,
         because a tall crop or a raised arm can reach up into the title. */
      .talk::before {
        content: "";
        position: absolute;
        z-index: 2;
        left: 0;
        right: 0;
        top: 0;
        /* Ends just under the copy. It ran to 900 at first and laid a shade
           across the crown of every figure tall enough to fill the frame. */
        height: 740px;
        background: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0.88) 78%, rgba(0, 0, 0, 0) 100%);
      }
      .talk .copy {
        position: absolute;
        z-index: 3;
        left: 72px;
        right: 72px;
        top: 300px;
      }
      .talk .at {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 40px;
        color: var(--green);
      }
      .talk .at span {
        margin-left: 0.3em;
        font-size: 0.6em;
        letter-spacing: 0.14em;
      }
      .talk h2 {
        margin-top: 18px;
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 84px;
        line-height: 0.98;
        text-transform: uppercase;
        text-wrap: balance;
      }
      .talk .who {
        margin-top: 26px;
        font-size: 36px;
        font-weight: 600;
      }
      .talk .by {
        margin-top: 12px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 21px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8b8b8b;
      }
      .talk .by span {
        color: var(--green);
      }

      /* ── The village ───────────────────────────────────────────────── */
      /* No face and no clock: the mark of the people running it, at size, and
         the line that says you can walk in whenever. */
      .village-scene {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 200px 72px 120px;
        text-align: center;
      }
      .village-scene img {
        width: 560px;
        height: auto;
      }
      .village-scene .at {
        margin-top: 56px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 30px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--green);
      }
      .village-scene h2 {
        margin-top: 20px;
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 104px;
        line-height: 0.95;
        text-transform: uppercase;
      }
      .village-scene .line {
        margin-top: 26px;
        max-width: 800px;
        font-size: 34px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.8);
      }
      .village-scene .by {
        margin-top: 22px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 21px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8b8b8b;
      }

      /* ── The outro — the first Short's, unchanged ──────────────────── */
      .outro {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        visibility: hidden;
      }
      .outro-bloom {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1100px;
        height: 1100px;
        margin: -550px 0 0 -550px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 255, 102, 0.1) 0%, transparent 62%);
        filter: blur(130px);
      }
      .outro > *:not(.outro-bloom) {
        position: relative;
      }
      .outro .bolt {
        width: 420px;
        height: auto;
        opacity: 0.95;
      }
      .outro .lockup {
        margin-top: 74px;
        height: 96px;
        width: auto;
      }
      .outro .name {
        margin-top: 58px;
        font-family: "OswaldLocal", Impact, sans-serif;
        font-weight: 700;
        font-size: 92px;
        line-height: 0.94;
        text-transform: uppercase;
        text-align: center;
      }
      .outro .when {
        margin-top: 34px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 26px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8b8b8b;
        text-align: center;
      }
      .outro .url {
        margin-top: 16px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 26px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--green);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="bloom"></div>

    <section class="scene open-scene">
      <div class="big"><span class="a">Access</span><br />Granted</div>
      <p class="hook">{{subtitle}}</p>
      <div class="when"><span>&gt;_</span> {{kicker}}</div>
    </section>

    {{scenes}}

    <section class="scene village-scene">
      <img src="village-logo.png" alt="" />
      <div class="at">{{villageWhen}}</div>
      <h2>{{villageTitle}}</h2>
      <p class="line">{{villageLine}}</p>
      <div class="by">Powered by {{villageBy}}</div>
    </section>

    <div class="chrome">
      <div class="top">
        <img src="sastw.png" alt="" />
        <div class="dates">{{week}}</div>
      </div>
      <div class="mark"><span class="a">Access</span> Granted</div>
    </div>

    <div class="outro">
      <div class="outro-bloom"></div>
      <img class="bolt" src="bolt.svg" alt="" />
      <img class="lockup" src="sastw.png" alt="" />
      <div class="name"><span class="a">Access</span> Granted</div>
      <div class="when">{{ctaLine}}</div>
      <div class="url">{{ctaUrl}}</div>
    </div>

    <script>
      /**
       * Step 0 is the opener, then one step per scene in DOM order — each
       * talk, then the village — and the step after the last is the outro.
       * The small wordmark in the chrome only shows on the talk scenes: the
       * opener already says the name at size, and the village says the name
       * of the people running it.
       */
      window.reveal = function (step) {
        const scenes = [...document.querySelectorAll(".scene")];
        scenes.forEach((el, i) => {
          el.style.visibility = i === step ? "visible" : "hidden";
        });
        const cur = scenes[step];
        document.querySelector(".chrome .mark").style.visibility =
          cur && cur.classList.contains("talk") ? "visible" : "hidden";
        document.querySelector(".chrome").style.visibility =
          step >= scenes.length ? "hidden" : "visible";
        document.querySelector(".outro").style.visibility =
          step >= scenes.length ? "visible" : "hidden";
      };
      window.reveal(0);
    </script>
  </body>
