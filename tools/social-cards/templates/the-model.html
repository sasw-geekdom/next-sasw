<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "OswaldLocal";
        src: url("oswald.woff") format("woff");
        font-weight: 700;
        font-display: block;
      }
      /* The Model's palette, from lib/the-model.ts. */
      :root {
        --lav: #c0b4fc;
        --cyan: #00b4fc;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1080px;
        height: 1350px;
        background: #000;
        color: #fff;
        font-family: "Geist", -apple-system, system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }

      .portrait {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .portrait img {
        position: absolute;
        left: {{portraitLeft}}px;
        bottom: 0;
        height: {{portraitHeight}}px;
        width: auto;
      }
      .portrait::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to right, #000 0%, #000 20%, rgba(0, 0, 0, 0) 52%),
          linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0) 14%);
      }

      .frame {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 78px 78px 60px;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .top img {
        height: 50px;
        width: auto;
      }
      .dates {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 19px;
        letter-spacing: 0.22em;
        color: #8b8b8b;
        text-transform: uppercase;
      }

      .eyebrow {
        margin-top: 46px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 20px;
        letter-spacing: 0.26em;
        color: #8b8b8b;
        text-transform: uppercase;
      }

      /* Geist, not the Oswald the other events' headlines use. This card
         predates that convention and its letterforms are visibly wider — the
         O in "OF" is circular where Oswald's is a condensed oval. Chasing the
         width with tracking on Oswald got the measure right and the shapes
         wrong. */
      h1 {
        margin-top: 23px;
        font-weight: 600;
        font-size: {{headlineSize}}px;
        line-height: 1.13;
        /* Word-spacing, not letter-spacing. The gaps between words are wide
           while the letters themselves sit normally — tracking the letters to
           reach the same measure got the width right and the rhythm wrong. */
        word-spacing: 0.34em;
        text-transform: uppercase;
      }
      /* The event's signature: a knocked-out lavender panel on the line that
         names the subject. Pulled left by its own padding so the panel's edge
         sits flush with the measure rather than the text inside it. */
      h1 .hit {
        background: var(--lav);
        color: #000;
        padding: 1px 6px 5px;
        margin-left: -6px;
        display: inline-block;
      }

      <!--if:subtitle-->
      /* A cyan rule, where PySA uses none and Access Granted uses green. */
      .blurb {
        margin-top: 30px;
        max-width: 760px;
        border-left: 3px solid var(--cyan);
        padding-left: 26px;
        font-size: 29px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.86);
      }
      <!--/if:subtitle-->

      .spacer {
        flex: 1;
      }
      /* Geist, matching the headline. This card predates the Oswald the later
         events use, and its name is set in the same grotesque — visibly wider
         and lighter than the condensed face. */
      .name {
        font-weight: 700;
        font-size: 45px;
        line-height: 1;
        text-transform: uppercase;
              }
      .role {
        margin-top: 14px;
        font-size: 25px;
        font-weight: 400;
        color: #ededed;
      }
      <!--if:org-->
      .org {
        margin-top: 12px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 17px;
        letter-spacing: 0.2em;
        color: #8b8b8b;
        text-transform: uppercase;
      }
      <!--/if:org-->

      .facts {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .fact {
        display: flex;
        align-items: center;
        gap: 13px;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 20px;
        letter-spacing: 0.06em;
        color: #ededed;
      }
      .fact .pip {
        width: 9px;
        height: 9px;
        background: var(--lav);
        flex: none;
      }

      .powered {
        margin-top: 40px;
      }
      .powered .label {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 16px;
        letter-spacing: 0.26em;
        color: #6f6f6f;
        text-transform: uppercase;
      }
      .logos {
        margin-top: 18px;
        display: flex;
        align-items: center;
        gap: 34px;
      }
      .logos img {
        width: auto;
      }
    </style>
  </head>
  <body>
    <div class="portrait"><img src="{{face}}" alt="" /></div>

    <div class="frame">
      <div class="top">
        <img src="sastw.png" alt="" />
        <div class="dates">{{week}}</div>
      </div>

      <div class="eyebrow">{{eyebrow}}</div>

      <h1>{{headline}}</h1>
      <!--if:subtitle-->
      <p class="blurb">{{subtitle}}</p>
      <!--/if:subtitle-->

      <div class="spacer"></div>

      <div class="name">{{first}}<br />{{last}}</div>
      <div class="role">{{role}}</div>
      <!--if:org-->
      <div class="org">{{org}}</div>
      <!--/if:org-->

      <div class="facts">
        <div class="fact"><span class="pip"></span>{{fact1}}</div>
        <div class="fact"><span class="pip"></span>{{fact2}}</div>
      </div>

      <div class="powered">
        <div class="label">// Powered by</div>
        <div class="logos">{{logos}}</div>
      </div>
    </div>
  </body>
</html>
