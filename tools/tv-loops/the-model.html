<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  /* The Model, on the room's TVs. 1920x1080 CSS px, captured at 2x = 4K.
     Every moving thing is a pure function of one time value (render(t)),
     so frames are exact and t = 60 is t = 0: a seamless loop.

     Assets: only what The Model's speaker cards carry — the cards themselves
     (rendered at 2x), the SASTW lockup. The wordmark and the selection block
     are type and colour, as on the cards.

     Layout: the afternoon's running order on the left, with a lavender
     selection that glides to whichever session's card is on the right. */
  :root { --lav: #c0b4fc; --cyan: #00b4fc; --ink: #09090b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  body { color: #fff; font-family: "Geist", system-ui, sans-serif; position: relative; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }

  /* A slow lavender light behind the card side — the ambient element,
     breathing on the loop's own period so the seam is invisible. */
  #glow {
    position: absolute; width: 1300px; height: 1300px; left: 900px; top: -110px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(192,180,252,0.22) 0%, rgba(0,180,252,0.06) 38%, transparent 66%);
    filter: blur(40px);
  }

  #lockup { position: absolute; left: 116px; top: 70px; height: 54px; z-index: 5; }
  #when { position: absolute; right: 116px; top: 84px; z-index: 5; font-size: 23px; letter-spacing: 0.14em; color: rgba(255,255,255,0.62); text-transform: uppercase; }
  #when b { color: var(--lav); font-weight: 500; }

  #left { position: absolute; left: 116px; top: 168px; width: 880px; z-index: 3; }
  .word { font-size: 84px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; text-transform: uppercase; color: rgba(255,255,255,0.88); white-space: nowrap; }
  .word .sel { display: inline-block; background: var(--lav); color: var(--ink); padding: 0 12px; margin-left: 4px; }
  .word .caret { display: inline-block; width: 7px; height: 72px; background: var(--cyan); margin-left: 10px; vertical-align: -6px; }
  .label { margin-top: 34px; font-size: 23px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
  .label span { color: var(--lav); }
  #rail { position: relative; margin-top: 16px; }
  #hl { position: absolute; left: -16px; right: 0; top: 0; background: var(--lav); border-radius: 4px; }
  .r { position: relative; display: grid; grid-template-columns: 138px 1fr; align-items: baseline; padding: 11px 0; }
  .r .t { font-size: 27px; color: var(--lav); }
  .r .t small { font-size: 16px; letter-spacing: 0.12em; margin-left: 5px; opacity: 0.75; }
  .r .ti { font-size: 30px; font-weight: 600; line-height: 1.18; color: rgba(255,255,255,0.9); }
  .r.on .t, .r.on .ti { color: var(--ink); }
  #url { position: absolute; left: 116px; bottom: 58px; z-index: 3; font-size: 22px; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); }
  #url span { color: var(--lav); }

  .card { position: absolute; right: 116px; top: 142px; width: 704px; height: 880px; z-index: 2; opacity: 0; }
  .card img { width: 100%; height: 100%; display: block; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08); }

  #grid { position: absolute; right: 116px; top: 142px; width: 704px; height: 880px; z-index: 2; opacity: 0;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 16px; }
  #grid img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
</style>
</head>
<body>
  <div id="glow"></div>
  <img id="lockup" src="assets/sastw-horizontal-white.png" alt="" />
  <div id="when" class="mono">Mon, Sept 28 · <b>1 – 6 PM</b> · Geekdom, 3rd Floor</div>

  <div id="left">
    <div class="word mono">The<span class="sel">Model</span><span class="caret"></span></div>
    <p class="label mono"><span>//</span> The afternoon</p>
    <div id="rail"><div id="hl"></div>__RAIL__</div>
  </div>
  <p id="url" class="mono"><span>//</span> sasw.co/schedule/the-model</p>

  <div id="grid">__GRID__</div>
  __CARDS__

<script>
  const LOOP = 60, INTRO = 6, EACH = 6, N = __N__;
  const FADE_IN = 0.6, FADE_OUT = 0.45, GLIDE = 0.8;
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const ease = (x) => { x = clamp(x); return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };

  let rows = null;
  const measure = () => { rows = [...document.querySelectorAll(".r")].map(r => ({ el: r, top: r.offsetTop, h: r.offsetHeight })); };

  const slideAt = (u) => (u < INTRO ? -1 : Math.floor((u - INTRO) / EACH));
  const slideStart = (i) => (i < 0 ? 0 : INTRO + i * EACH);
  const slideLen = (i) => (i < 0 ? INTRO : EACH);

  window.render = function (t) {
    if (!rows) measure();
    const u = mod(t, LOOP);
    const cur = slideAt(u);
    const lt = u - slideStart(cur);
    const len = slideLen(cur);
    const fade = lt < FADE_IN ? ease(lt / FADE_IN) : lt > len - FADE_OUT ? 1 - ease((lt - (len - FADE_OUT)) / FADE_OUT) : 1;

    const b = Math.sin((u / LOOP) * Math.PI * 2);
    document.getElementById("glow").style.transform = `translate(${b * 40}px, ${b * -24}px) scale(${1 + b * 0.04})`;
    document.querySelector(".caret").style.opacity = Math.floor(u * 1.2) % 2 === 0 ? 1 : 0.15;

    const grid = document.getElementById("grid");
    grid.style.opacity = cur === -1 ? fade : 0;
    grid.querySelectorAll("img").forEach((im, i) => {
      const k = cur === -1 ? ease((lt - 0.2 - i * 0.12) / 0.5) : 0;
      im.style.opacity = k;
      im.style.transform = `translateY(${(1 - k) * 16}px)`;
    });

    document.querySelectorAll(".card").forEach((c, i) => {
      if (i !== cur) { c.style.opacity = 0; c.style.visibility = "hidden"; return; }
      c.style.visibility = "visible";
      c.style.opacity = fade;
      const inK = ease(lt / 0.9);
      c.style.transform = `translateX(${(1 - inK) * 70}px) scale(${1 + (lt / EACH) * 0.025})`;
    });

    const hl = document.getElementById("hl");
    const k = ease(lt / GLIDE);
    let y, h, o = 1;
    if (cur === -1) {
      const last = rows[N - 1];
      y = last.top; h = last.h; o = 1 - k;
    } else if (cur === 0) {
      const r = rows[0];
      y = r.top - 30 * (1 - k); h = r.h; o = k;
    } else {
      const a = rows[cur - 1], z = rows[cur];
      y = a.top + (z.top - a.top) * k; h = a.h + (z.h - a.h) * k;
    }
    hl.style.transform = `translateY(${y}px)`; hl.style.height = h + "px"; hl.style.opacity = o;
    // Ink follows the highlight, not the slide: whichever row the block is
    // over is knocked out, so no row ever sits on lavender in white.
    const mid = y + h / 2;
    let near = -1, best = Infinity;
    rows.forEach((r, i) => { const dd = Math.abs(r.top + r.h / 2 - mid); if (dd < best) { best = dd; near = i; } });
    rows.forEach((r, i) => r.el.classList.toggle("on", o > 0.5 && i === near));
  };
  window.render(10);
</script>
</body>
</html>
